<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>건물이 지어지는 과정 | 시공 8단계</title>
<meta name="description" content="고등학생을 위한 건물 시공 과정 3D 탐험 – 공사 준비부터 완공까지 8단계">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --yellow:#FFC21A; --yellow-d:#e2a600; --ink:#1c2026; --sub:#5a626e; --line:#e4e6ea;
  --card:rgba(255,255,255,.95); --shadow:0 10px 30px rgba(20,30,45,.16);
  --pw:392px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe8ef;color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:var(--shadow)}
.brand i{width:22px;height:22px;border-radius:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 5px,#1c2026 5px 10px)}
.stepper{flex:1;display:flex;gap:4px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:5px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper,.stepper *{user-select:none;-webkit-user-select:none}
.stepper{cursor:grab;touch-action:pan-x}
.stepper .st{cursor:inherit}
.stepper.dragging,.stepper.dragging .st{cursor:grabbing}
.st{flex:1 0 auto;min-width:64px;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);transition:background .2s,color .2s}
.st b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eef0f3;font-size:12px;font-weight:800;color:var(--sub);flex:none}
.st.done b{background:#2f3540;color:#fff}
.st.cur{background:var(--yellow);color:var(--ink)}
.st.cur b{background:var(--ink);color:var(--yellow)}
.iconbtn{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:20px}
.iconbtn.on{background:var(--yellow)}

/* ---------- panel ---------- */
.panel{position:fixed;z-index:6;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.panel.hidden{opacity:0;pointer-events:none}
.pbody{overflow-y:auto;padding:22px 22px 10px;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{background:var(--ink);color:var(--yellow);font-weight:800;font-size:13px;letter-spacing:.06em;padding:5px 10px;border-radius:8px}
.term{font-size:13px;font-weight:700;color:var(--sub);background:#f0f2f5;padding:5px 9px;border-radius:8px}
.panel h2{margin:4px 0 6px;font-size:28px;line-height:1.25;font-weight:850;letter-spacing:-.02em}
.lead{margin:0 0 14px;font-size:16.5px;font-weight:600;color:#38404b;line-height:1.5}
.subs{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;counter-reset:sub}
.sub{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:11px;background:#f0f2f5;padding:9px 12px;font-size:15px;font-weight:700;color:#4a525e;min-height:44px;counter-increment:sub}
.sub::before{content:counter(sub);position:relative;z-index:1;flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--sub);font-size:12.5px;font-weight:800}
.sub.now::before,.sub.fin::before{background:var(--ink);color:var(--yellow)}
.sub i{position:absolute;inset:0;width:calc(var(--p,0)*100%);background:rgba(255,194,26,.55);transition:width .12s linear}
.sub span{position:relative;flex:1}
.sub.now{color:var(--ink);box-shadow:inset 0 0 0 2px var(--yellow-d)}
.sub.fin{color:var(--ink)}
.sub.fin span::after{content:"✓";float:right;font-weight:900}
.floorinfo{font-size:14px;font-weight:700;color:var(--sub);margin:-4px 0 12px;display:none}
.floorinfo b{color:var(--ink);background:var(--yellow);padding:2px 8px;border-radius:6px}
.desc{margin:0 0 14px;font-size:16px;line-height:1.72;color:#2b313a;word-break:keep-all}
.tip{display:flex;gap:10px;background:#fff7dc;border:1px solid #f5dd8b;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.55;margin-bottom:12px;word-break:keep-all}
.tip b{flex:none;font-weight:800}
.legend{display:none;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px;font-size:14.5px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:22px;height:8px;border-radius:4px}
.toggle{display:none;width:100%;min-height:52px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;margin-bottom:6px}
.toggle.on{background:var(--yellow);color:var(--ink)}
.controls{display:grid;grid-template-columns:1fr 56px 56px 1.4fr;gap:8px;padding:12px 22px 18px;border-top:1px solid var(--line)}
.controls button{min-height:56px;border-radius:14px;font-weight:800;font-size:16px;background:#eef0f3}
.controls .next{background:var(--yellow);color:var(--ink)}
.controls button:disabled{opacity:.35}
.controls .ic{font-size:20px}

/* landscape tablet / desktop: panel on right */
@media (orientation:landscape) and (min-width:760px){
  .panel{top:12px;right:12px;bottom:12px;width:var(--pw);border-radius:22px}
  .topbar{right:calc(var(--pw) + 24px)}
}
@media (orientation:landscape) and (min-width:760px) and (max-height:620px){
  .panel h2{font-size:24px}.desc{font-size:15px;line-height:1.6}.pbody{padding:16px 18px 8px}
}
@media (orientation:landscape) and (min-width:760px) and (max-width:1500px){ .st{min-width:auto} .st span{display:none} .st.cur span{display:inline} }
/* portrait or narrow: bottom sheet */
@media (orientation:portrait),(max-width:759px){
  .panel{left:0;right:0;bottom:0;max-height:43vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .brand span{display:none}
  .st{min-width:auto}
  .st span{display:none}
  .st.cur span{display:inline}
  .panel h2{font-size:24px}
}

/* ---------- 3D labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center}
.lbl .pill{display:flex;align-items:center;gap:6px;background:rgba(28,32,38,.88);color:#fff;font-size:14px;font-weight:700;padding:7px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lbl .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.lbl .stem{width:2px;height:14px;background:rgba(28,32,38,.6)}
.lbl .d{display:none;max-width:220px;white-space:normal;background:#fff;color:var(--ink);font-size:14px;font-weight:600;line-height:1.5;padding:10px 12px;border-radius:12px;margin-bottom:6px;box-shadow:0 6px 18px rgba(0,0,0,.18);word-break:keep-all}
.lbl.open .d{display:block}
.lbl.open .pill{background:var(--yellow);color:var(--ink)}
.lbl.open .pill::before{background:var(--ink)}
body.nolabels #labels{display:none}

.hint{position:fixed;left:14px;bottom:14px;z-index:4;font-size:13px;font-weight:700;color:#38404b;background:rgba(255,255,255,.8);padding:8px 12px;border-radius:10px;pointer-events:none;transition:opacity .6s}
@media (orientation:portrait),(max-width:759px){.hint{bottom:auto;top:72px}}

.toast{position:fixed;z-index:8;left:50%;top:76px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- concrete gauge ---------- */
.gauge{position:fixed;left:0;top:0;z-index:4;pointer-events:none;display:none;flex-direction:column;align-items:center;transform:translate(-50%,-100%)}
.gauge .box{min-width:210px;max-width:260px;background:rgba(255,255,255,.96);border-radius:14px;padding:10px 13px 11px;box-shadow:0 8px 24px rgba(0,0,0,.2);border:2px solid var(--ink)}
.gauge .t{font-size:15.5px;font-weight:850;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.gauge .s{font-size:13px;font-weight:650;color:#4a525e;margin-top:3px;line-height:1.4;word-break:keep-all}
.gauge .bar{margin-top:7px;height:10px;border-radius:6px;background:#e6e8ec;overflow:hidden}
.gauge .bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#5e5c58,#8e8b85)}
.gauge.cure .bar i{background:linear-gradient(90deg,#6e6c68,#dedbd3)}
.gauge.cure{}
.gauge .stem{width:2px;height:16px;background:var(--ink)}
.gauge .dot{width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);margin-top:-2px}
/* ---------- approval stamp ---------- */
.approved{position:fixed;z-index:4;left:50%;top:92px;transform:translateX(-50%) scale(.6) rotate(-6deg);opacity:0;pointer-events:none;
  border:4px solid #d0342c;color:#d0342c;background:rgba(255,255,255,.92);border-radius:16px;padding:10px 22px;text-align:center;transition:opacity .4s,transform .5s cubic-bezier(.2,1.6,.4,1)}
.approved.show{opacity:1;transform:translateX(-50%) scale(1) rotate(-6deg)}
.approved b{display:block;font-size:30px;font-weight:900;letter-spacing:.08em}
.approved small{font-size:14px;font-weight:700}
@media (orientation:landscape) and (min-width:760px){.approved{left:calc((100% - var(--pw) - 24px)/2)}}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;padding:6vh 6vw;
  background:linear-gradient(90deg,rgba(20,24,30,.78) 0%,rgba(20,24,30,.45) 48%,rgba(20,24,30,0) 80%);color:#fff;transition:opacity .6s}
.intro.gone{opacity:0;pointer-events:none}
.intro .box{max-width:560px}
.intro .kick{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:.08em;color:var(--yellow);margin-bottom:12px}
.intro .kick i{width:28px;height:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 5px,transparent 5px 10px)}
.intro h1{margin:0 0 14px;font-size:clamp(34px,6vw,58px);line-height:1.12;font-weight:900;letter-spacing:-.03em;word-break:keep-all}
.intro p{margin:0 0 26px;font-size:clamp(16px,2.2vw,19px);line-height:1.6;color:#e8ecf1;word-break:keep-all}
.intro .go{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:20px;padding:18px 30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.intro .steps8{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.intro .steps8 span{font-size:13.5px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:999px}
.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#dfe8ef;font-weight:800;color:var(--sub);transition:opacity .5s}
.loading.gone{opacity:0;pointer-events:none}

/* Language selection remains available before and during the simulation. */
.language-switch{position:fixed;z-index:25;top:12px;right:12px;display:flex;align-items:center;gap:9px;
  padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);font-size:14px;font-weight:800}
.language-switch select{font:inherit;color:var(--ink);background:#f0f2f5;border:1px solid #c9ced6;border-radius:8px;padding:7px 30px 7px 10px;min-height:38px;cursor:pointer}
.language-switch select:focus-visible,button:focus-visible{outline:3px solid #1673c5;outline-offset:3px}
.topbar{top:78px}
.stepper{min-width:0}
.meta{flex-wrap:wrap}.badge{flex:none}.term{min-width:0}
.intro{overflow-y:auto}.intro .box{width:100%}
html[lang="ru"] .desc,html[lang="ru"] .tip,html[lang="ru"] .intro h1,html[lang="ru"] .intro p,
html[lang="ru"] .lbl .d,html[lang="ru"] .gauge .s{word-break:normal;overflow-wrap:break-word;hyphens:auto}
html[lang="ru"] .tip{flex-wrap:wrap;gap:6px}
html[lang="ru"] .gauge .t{white-space:normal;line-height:1.3}
html[lang="ru"] .gauge .box{max-width:min(300px,calc(100vw - 32px))}
html[lang="ru"] .lbl .pill{max-width:min(310px,calc(100vw - 24px));white-space:normal;text-align:center}
html[lang="ru"] .lbl .pill::before{flex:none}
html[lang="ru"] .approved{max-width:calc(100vw - 32px);width:max-content}
html[lang="ru"] .approved b{font-size:clamp(18px,2vw,25px);letter-spacing:.01em}
html[lang="ru"] .approved small{display:block;font-size:13px}
.hint{max-width:calc(100vw - 28px)}
@media (orientation:landscape) and (min-width:760px){.panel{top:78px}}
@media (orientation:landscape) and (min-width:760px) and (max-width:1180px){.brand span{display:none}}
@media (orientation:portrait),(max-width:759px){
  .topbar{gap:5px;left:8px;right:8px}
  .brand{padding:10px}.iconbtn{width:40px;height:44px;border-radius:12px}
  .st{padding:7px 6px}.st.cur span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint{top:136px;font-size:12px}
  .intro{align-items:flex-start;padding:204px 24px 28px}
  .intro .kick{letter-spacing:.02em}.intro h1{font-size:clamp(32px,7vw,48px)}
  .intro .go{font-size:18px;padding:16px 24px}
  .controls{grid-template-columns:1fr 44px 44px 1.15fr;gap:6px;padding:10px 14px 14px}
  .controls button{font-size:14px;min-height:50px}.controls .ic{font-size:20px}
  .approved{top:178px}
}
</style>

<body>
<div class="language-switch">
  <label for="languageSelect">🌐 <span data-i18n="language">언어</span></label>
  <select id="languageSelect" data-i18n-aria-label="chooseLanguage" aria-label="언어 선택">
    <option value="ko" lang="ko">한국어</option>
    <option value="ru" lang="ru">Русский</option>
  </select>
</div>
<div id="stage"></div>
<div id="labels"></div>

<div class="topbar">
  <div class="brand"><i></i><span data-i18n="brand">건물이 지어지는 과정</span></div>
  <nav class="stepper" id="stepper"></nav>
  <button class="iconbtn on" id="btnLabels" data-i18n-title="labelsTitle" data-i18n-aria-label="labelsAria" title="이름표 보기/숨기기" aria-label="이름표">🏷️</button>
  <button class="iconbtn on" id="btnSound" data-i18n-title="soundTitle" data-i18n-aria-label="soundAria" title="소리 (배경음·효과음)" aria-label="소리">🔊</button>
  <button class="iconbtn" id="btnCam" data-i18n-title="camera" data-i18n-aria-label="camera" title="시점 되돌리기" aria-label="시점 되돌리기">🎥</button>
</div>

<div class="hint" id="hint" data-i18n="hint">👆 화면을 드래그하면 돌려 볼 수 있어요 · 두 손가락으로 확대</div>
<div class="toast" id="toast"></div>
<div class="gauge" id="gauge"><div class="box"><div class="t" id="gT"></div><div class="s" id="gS"></div><div class="bar"><i id="gB"></i></div></div><div class="stem"></div><div class="dot"></div></div>
<div class="approved" id="approved"><b data-i18n="approved">사용 승인</b><small data-i18n="approvedDetail">준공검사 통과 · 안전 확인 완료</small></div>

<aside class="panel hidden" id="panel">
  <div class="pbody">
    <div class="meta"><span class="badge" id="badge">STEP 1</span><span class="term" id="term">가설공사</span></div>
    <h2 id="title">공사 준비하기</h2>
    <p class="lead" id="lead"></p>
    <div class="subs" id="subs"></div>
    <div class="floorinfo" id="floorinfo"></div>
    <p class="desc" id="desc"></p>
    <div class="legend" id="legend">
      <span><i style="background:#2f8de4"></i><span data-i18n="water">수도관 (물)</span></span>
      <span><i style="background:#f6c315"></i><span data-i18n="electricity">전기선</span></span>
      <span><i style="background:#a9b2bb"></i><span data-i18n="air">공기 통로</span></span>
      <span><i style="background:#cfd6dd;border:1px solid #8a949e"></i><span data-i18n="elevator">엘리베이터</span></span>
    </div>
    <button class="toggle" id="toggle"></button>
    <div class="tip"><b data-i18n="tipHeading">💡 알아두기</b><span id="tip"></span></div>
  </div>
  <div class="controls">
    <button id="prev" data-i18n="previous">◀ 이전</button>
    <button class="ic" id="play" data-i18n-title="playPause" data-i18n-aria-label="playPause" title="재생/멈춤" aria-label="재생/멈춤">⏸</button>
    <button class="ic" id="replay" data-i18n-title="replayTitle" data-i18n-aria-label="replayAria" title="이 단계 다시 보기" aria-label="다시 보기">↻</button>
    <button class="next" id="next">다음 단계 ▶</button>
  </div>
</aside>

<div class="intro" id="intro">
  <div class="box">
    <div class="kick"><i></i><span data-i18n="introKick">건설 기술 · 시공 과정</span></div>
    <h1 data-i18n-html="introTitle">건물은 어떻게<br>지어질까?</h1>
    <p data-i18n-html="introDescription">텅 빈 땅에서 4층 건물이 완성되기까지,<br>실제 공사 현장의 순서를 8단계로 따라가 봐요.</p>
    <div class="steps8"><span data-i18n="introStage1">1 가설공사</span><span data-i18n="introStage2">2 토공사</span><span data-i18n="introStage3">3 기초공사</span><span data-i18n="introStage4">4 골조공사(뼈대)</span><span data-i18n="introStage5">5 골조공사(외벽)</span><span data-i18n="introStage6">6 설비공사</span><span data-i18n="introStage7">7 실내 및 마감공사</span><span data-i18n="introStage8">8 준공(완성)</span></div>
    <button class="go" id="start" data-i18n="start">🚧 공사 시작하기</button>
  </div>
</div>
<div class="loading" id="loading" data-i18n="loading">공사 현장을 준비하고 있어요…</div>

<script>

function pathPos(pts,dist){
  let total=0; const segs=[]; for(let i=0;i<pts.length;i++){ const a=pts[i],b=pts[(i+1)%pts.length]; const L=Math.hypot(b[0]-a[0],b[1]-a[1]); segs.push([a,b,L]); total+=L; }
  let d=((dist%total)+total)%total;
  for(const [a,b,L] of segs){ if(d<=L){ const t=d/L; return {x:lerp(a[0],b[0],t),z:lerp(a[1],b[1],t),h:Math.atan2(b[0]-a[0],b[1]-a[1])}; } d-=L; }
  return {x:pts[0][0],z:pts[0][1],h:0};
}

// 땅 파기 타임라인 (초 단위): 트럭 도착 → 3번 퍼 담기 → 트럭 출발, 트럭 2대
const DIG = {start:1.17, end:1.93, tin:3.6, seg:4.5, tout:3.3};
DIG.cyc = DIG.tin + 3*DIG.seg + DIG.tout;
function digTimeline(tau){
  const curl = pp => clamp((pp-.42)/.13);
  const out = {p:.1, truckX:null, load:0, moving:false, fall:-1, digs:0, parked:false, dumps:0};
  if(tau<0){ return out; }
  if(tau>=2*DIG.cyc){ out.p=0; out.digs=6; out.dumps=6; return out; }
  const c = Math.floor(tau/DIG.cyc), t = tau - c*DIG.cyc;
  let digs = c===0?0:4, dumps = c*3;
  if(t<DIG.tin){
    const k=t/DIG.tin; out.truckX=lerp(-42,TRUCK_PARK.x,easeOut(k)); out.moving=true;
    if(c===0){ out.p=lerp(.1,.68,ease(clamp(t/(DIG.tin*.9)))); digs+=curl(out.p); } else out.p=.68;
  } else {
    if(c===0) digs+=1;
    const t2=t-DIG.tin;
    if(t2<3*DIG.seg){
      out.truckX=TRUCK_PARK.x; out.parked=true;
      const k=Math.floor(t2/DIG.seg), r=(t2-k*DIG.seg)/DIG.seg;
      const last = c===1 && k===2;
      const rr = last? Math.min(r,.32) : r;
      out.p = (.68+rr)%1;
      for(let j=0;j<k;j++) if(!(c===1&&j===2)) digs+=1;
      if(rr>.32) digs+=curl(out.p);
      out.load = k + (rr>.3?1:0);
      if(rr>=.25 && rr<.33) out.fall=(rr-.25)/.08;
      dumps += out.load;
    } else {
      for(let j=0;j<3;j++) if(!(c===1&&j===2)) digs+=1;
      const k=(t2-3*DIG.seg)/DIG.tout;
      out.truckX=lerp(TRUCK_PARK.x,45,k*k); out.moving=true; out.load=3; dumps+=3;
      out.p = c===1? 0 : .68;
    }
  }
  out.digs=digs; out.dumps=dumps; return out;
}

  for(const [x,z] of [[-.2,-.2],[.2,-.2],[.2,.2],[-.2,.2]]) parts.push(new THREE.CylinderGeometry(.035,.035,h,5).translate(x,h/2,z));
  for(let y=.25;y<h;y+=.45){
    parts.push(new THREE.BoxGeometry(.44,.03,.03).translate(0,y,-.2), new THREE.BoxGeometry(.44,.03,.03).translate(0,y,.2),
               new THREE.BoxGeometry(.03,.03,.44).translate(-.2,y,0), new THREE.BoxGeometry(.03,.03,.44).translate(.2,y,0));
  }
  return mergeGeometries(parts);
}
function barGrid(dir){ // dir 0: x방향 철근, 1: z방향 철근
  const parts=[];
  for(let i=0;i<=20;i++){ const t=-8+i*.8; parts.push(dir===0? new THREE.BoxGeometry(16.2,.05,.05).translate(0,0,t) : new THREE.BoxGeometry(.05,.05,16.2).translate(t,.06,0)); }
  return mergeGeometries(parts);
}

function updateSpray(on,y,time,corners){
  sprayPts.visible=on; sprinklers.forEach(p=>p.g.visible=on);
  if(!on) return;
  const pos=sprayGeo.attributes.position;
  corners.forEach(([x,z],k)=>{ const p=sprinklers[k]; p.g.position.set(x,y,z); p.g.rotation.y=Math.atan2(-x,-z); p.armR.rotation.x=-1.2; p.armL.rotation.x=-1.0; p.legL.rotation.x=p.legR.rotation.x=0; });
  for(let i=0;i<SPRAY_N;i++){
    const [ph,j1,j2,sp]=sprayRnd[i]; const k=i%2; const [cx,cz]=corners[k];
    const t=((time*.8+ph)%1)*1.15;
    const dx=-cx, dz=-cz, L=Math.hypot(dx,dz); const sweep=Math.sin(time*.9+k*2)*.5;
    const ca=Math.cos(sweep), sa=Math.sin(sweep);
    const ux=(dx*ca-dz*sa)/L, uz=(dx*sa+dz*ca)/L;
    const v=4.2+sp*1.8;
    pos.setXYZ(i, cx+ux*.6+(ux*v+j1*1.2)*t, y+1.35+(2.6+j2)*t-4.9*t*t, cz+uz*.6+(uz*v+j2*1.2)*t);
  }
  pos.needsUpdate=true;
}

let curT = 8, stageIdx = 0, playing = false, started = false;
let xray = true, cutaway = true, night = false;
let xrayK = 0, cutK = 0, nightK = 0;
const tmpC = new THREE.Color();

function topLevel(T){
  if(T<3) return .02;
  const k=(T-3)/.25, f=Math.floor(k);
  if(f>=4) return LT[3];
  const u=k-f; return u>.3? LT[f] : (f>0? LT[f-1] : .02);
}
function setTransp(m,flag){ if(m.transparent!==flag){ m.transparent=flag; m.needsUpdate=true; } }
function update(T, time, dt){
  // ---------- 땅 / 구덩이
  digInfo = digTimeline((T-DIG.start)*STAGES[1].dur);
  const depth = PIT_DEPTH*clamp(digInfo.digs/6);
  pitFloor.position.y = -depth+.001;
  pitFloor.visible = T<2.95;
  pitWalls.forEach(w=>{ w.visible = depth>.01 && T<2.95; w.scale.y = Math.max(depth,.001); });
  shoring.forEach((o,i)=>{ const k=easeOut(seg(T,1.0+i*.0038,1.03+i*.0038)); o.visible = k>0 && T<2.95; o.position.y = -2.6 + (1-k)*8; });
  siteDirt.visible = true;
  { const op=seg(T,7.3,7.45); mat.plaza.opacity=op; sitePlaza.visible=op>0; setTransp(mat.plaza,op<1); mat.plaza.depthWrite=op>=1; }

  // ---------- 울타리 · 사무소 · 측량
  const nF=fencePanels.length;
  fencePanels.forEach((p,i)=>{
    const kin=backOut(seg(T,.02+.28*i/nF,.07+.28*i/nF)); const kout=1-ease(seg(T,7.18+.12*(nF-i)/nF,7.22+.12*(nF-i)/nF));
    const k=Math.min(kin,kout); p.visible=k>.01; p.scale.y=Math.max(k,.01);
  });
  { const kin=easeOut(seg(T,.33,.43)), kout=ease(seg(T,7.18,7.3)); office.visible=T>=.33&&kout<1; office.position.y=(1-kin)*9+kout*12; }
  { const k=seg(T,.4,.46); toilet.visible=k>0&&T<7.24; toilet.position.y=(1-easeOut(k))*7; }
  const surveyOn = T<1.2;
  stakes.forEach((s,i)=>{ const k=seg(T,.48+i*.03,.53+i*.03); s.visible=k>0&&surveyOn; s.scale.y=Math.max(easeOut(k),.01); });
  strings.forEach((s,i)=>{ grow(s, ease(seg(T,.6+i*.06,.66+i*.06))); if(!surveyOn) s.visible=false; });
  chalks.forEach((s,i)=>{ grow(s, ease(seg(T,.74+i*.05,.79+i*.05))); if(!surveyOn||T>1.3) s.visible=false; });
  tripod.visible = inWin(T,.47,1.12);

  // ---------- 굴착기
  exc.g.visible = inWin(T,1.1,2.0);
  if(exc.g.visible){
    const kin=easeOut(seg(T,1.1,1.165)), kout=ease(seg(T,1.935,1.995));
    exc.g.position.set(EXC_POS.x+kout*16, 0, lerp(24,EXC_POS.z,kin));
    exc.g.rotation.y = kout>0? -Math.PI/2*kout : 0;
    const p = digInfo.p;
    const K=[0,.25,.42,.55,.68,.85,.93,1];
    const Y1=EXC_TRUCK_YAW;
    exc.upper.rotation.y = kout>0? 0 : keyInterp(K,[Y1,0,0,0,0,Y1,Y1,Y1],p);
    exc.boomP.rotation.x = keyInterp(K,[.45,.2,-.3,-.32,.45,.45,.45,.45],p);
    exc.armP.rotation.x  = keyInterp(K,[-.85,-.6,-1.1-depth*.12,-1.5,-1.0,-.85,-.85,-.85],p);
    exc.bucketP.rotation.x=keyInterp(K,[1.0,.5,.3,-1.3,-1.4,-1.4,1.0,1.0],p);
    exc.dirt.visible = p>.5 && p<.9 && kout===0 && T>=DIG.start;
  }
  // ---------- 덤프트럭 (굴착기와 같은 타임라인)
  dump.g.visible = digInfo.truckX!==null && T<2.0;
  fallDirt.visible = false;
  if(dump.g.visible){
    dump.g.position.set(digInfo.truckX,0,TRUCK_PARK.z);
    let loadK = digInfo.load/3;
    if(digInfo.fall>=0){
      const f=clamp(digInfo.fall);
      exc.bucketP.getWorldPosition(_bw);
      const bx=digInfo.truckX-.9, by=2.1+loadK*.6, bz=TRUCK_PARK.z;
      fallDirt.visible = f<.98;
      fallDirt.position.set(lerp(_bw.x,bx,f), lerp(_bw.y-.3,by,f*f), lerp(_bw.z,bz,f));
      fallDirt.scale.setScalar(1+f*.5);
      fallDirt.rotation.y += dt*3;
    }
    dump.load.visible = loadK>.02; dump.load.scale.set(1,Math.max(loadK,.02),1); dump.load.position.y=.2+.5*loadK;
    if(digInfo.moving && playing) dump.wheels.forEach(w=>w.rotation.z -= dt*7);
  }
  // ---------- 말뚝 · 말뚝 박는 기계
  const PW=.0225, P0=2.02;
  piles.forEach((pl,i)=>{
    const a=P0+i*PW, u=seg(T,a,a+PW);
    pl.visible = T>=a+PW*.3 && T<2.98;
    const drive = ease(seg(u,.4,1));
    const top = lerp(4.2,-1.85,drive);
    pl.position.y = top-3;
    if(u<.4){ pl.position.y = 4.2-3 + (1-seg(u,.3,.4))*2; }
  });
  driver.g.visible = inWin(T,2.0,2.42);
  if(driver.g.visible){
    const i=clamp(Math.floor((T-P0)/PW),0,piles.length-1);
    const u=seg(T,P0+i*PW,P0+(i+1)*PW);
    const cur=pileOrder[i], prev=pileOrder[Math.max(i-1,0)];
    const mv=ease(seg(u,0,.3));
    const px=lerp(prev[0],cur[0],mv), pz=lerp(prev[1],cur[1],mv);
    const sx=Math.sign(px)||1;
    driver.g.position.set(px - sx*1.55*0 , -PIT_DEPTH, pz + 1.55);
    driver.g.rotation.y = 0;
    const kin=seg(T,2.0,2.03); driver.g.scale.setScalar(Math.max(backOut(kin),.01));
    const pileTop = lerp(4.2,-1.85,ease(seg(u,.4,1)));
    driver.ham.position.y = Math.max(pileTop+PIT_DEPTH-.75,1.2) + (u>.4&&u<1? Math.abs(Math.sin(time*9))*.8 : 0);
  }

  // ---------- 철근 · 기초 콘크리트
  rebarBars.forEach((b,i)=>{ grow(b, ease(seg(T,2.385+i*.0035,2.415+i*.0035))); if(T>2.8) b.visible=false; });
  gauge.show=false; pourTarget=null;
  let sprayOn=false, sprayY=0, sprayCorners=null;
  { const k=seg(T,2.52,2.78); foundation.visible=k>0; foundation.scale.y=Math.max(k,.001);
    setConcrete(mat.found, 1-ease(seg(T,2.8,2.98)));
    const lvl=-PIT_DEPTH+(PIT_DEPTH+.04)*k;
    if(inWin(T,2.52,2.78)){
      pourTarget={x:Math.sin(time*.55)*5.2, z:Math.cos(time*.43)*5.2, y:lvl};
      gauge.show=true; gauge.mode='pour'; gauge.title=t('foundationPour'); gauge.sub=t('foundationPourDetail'); gauge.p=k; gauge.pos.set(-4,1.5,-4);
    } else if(inWin(T,2.78,3.0)){
      const c=seg(T,2.8,2.98);
      gauge.show=true; gauge.mode='cure'; gauge.title=c<1?t('foundationCure',{day:Math.max(1,Math.round(c*28))}):t('foundationCured'); gauge.sub=c<1?t('foundationCureDetail'):t('foundationCuredDetail'); gauge.p=c; gauge.pos.set(-4,1.5,-4);
      sprayOn = T<2.985; sprayY=.02; sprayCorners=[[-7.9,7.9],[7.9,-7.9]];
    }
  }

  // ---------- 골조 (철근 → 거푸집 → 콘크리트 붓기 → 굳히기 → 틀 떼기)
  floors.forEach((F,f)=>{
    const a=3+f*.25, u=seg(T,a,a+.25), vis=T>=a;
    const S=(r)=>seg(u,FU[r][0],FU[r][1]);
    // 1) 기둥 철근
    const kc=ease(S('cage'));
    F.cages.forEach((c,i)=>{ const k=ease(seg(u,FU.cage[0]+i*.004,FU.cage[1]-(15-i)*.004)); c.visible=vis&&k>0&&u<FU.colPour[1]; c.scale.y=Math.max(k,.001); });
    // 2) 기둥 거푸집
    const kf=ease(S('forms')), strip=ease(S('strip'));
    const colFill = (row)=>ease(seg(u,FU.colPour[0]+row*.0275,FU.colPour[0]+(row+1)*.0275));
    const seeThrough = inWin(u,FU.colPour[0]-.01,FU.colPour[1]+.02) ? .32 : 1;
    F.formM.opacity = Math.min(seeThrough, 1-strip); setTransp(F.formM, F.formM.opacity<.995); F.formM.depthWrite=F.formM.opacity>.5;
    F.forms.forEach((fm,i)=>{ fm.visible=vis&&kf>0&&strip<1; fm.scale.set(1+strip*.5,Math.max(kf,.001),1+strip*.5); });
    // 3) 바닥 거푸집 · 받침 · 가장자리 · 바닥 철근
    const kd=ease(S('deck'));
    F.deck.visible=vis&&kd>0&&u<FU.strip[1]; F.deck.scale.set(Math.max(kd,.01),1,Math.max(kd,.01));
    F.props.visible=vis&&u>=FU.deck[0]&&u<FU.strip[1];
    const ke=ease(S('edge'));
    F.edges.forEach(e=>{ e.visible=vis&&ke>0&&strip<1; e.scale.y=Math.max(ke,.001); });
    const kb=ease(S('slabBar'));
    F.slabBarsX.visible=vis&&kb>0&&u<FU.slabPour[1]; F.slabBarsX.scale.x=Math.max(Math.min(kb*2,1),.01);
    F.slabBarsZ.visible=vis&&kb>.5&&u<FU.slabPour[1]; F.slabBarsZ.scale.z=Math.max(kb*2-1,.01);
    // 4) 콘크리트: 기둥 줄마다 채우고 → 바닥을 4줄로 지그재그 붓기
    F.cols.forEach(c=>{ const k=colFill(c.userData.row); c.visible=vis&&k>0; c.scale.y=Math.max(k,.001); });
    const kcore=ease(seg(u,FU.colPour[0]+.02,FU.colPour[1]));
    F.core.forEach(c=>{ c.visible=vis&&kcore>0; c.scale.y=Math.max(kcore,.001); });
    const sp0=FU.slabPour[0], sl=(FU.slabPour[1]-FU.slabPour[0])/4;
    F.strips.forEach((st,i)=>{ const k=seg(u,sp0+i*sl,sp0+(i+1)*sl); st.visible=vis&&k>0; st.scale.x=Math.max(k,.001); });
    // 5) 굳히기: 반짝이는 진회색 → 밝은 회색
    const cure=S('cure');
    setConcrete(F.cM, 1-ease(cure)); F.coreM.color.copy(F.cM.color);
    if(!vis) return;
    if(u>=FU.colPour[0] && u<FU.colPour[1]){
      const row=clamp(Math.floor((u-FU.colPour[0])/.0275),0,3), k=colFill(row);
      const zi=Math.floor((time*1.6)%4);
      pourTarget={x:GX[row], z:GX[zi], y:BASE[f]+F.h*k};
      gauge.show=true; gauge.mode='pour'; gauge.title=t('columnPour',{floor:f+1}); gauge.sub=t('columnPourDetail'); gauge.p=seg(u,FU.colPour[0],FU.slabPour[1]); gauge.pos.set(GX[row],LT[f]+1.2,-7.5);

function aimBoom(target){
  // 터렛 월드 위치
  const base = new THREE.Vector3(); pump.turret.getWorldPosition(base); base.y += .9;
  let tgt = target;
  if(!tgt){ tgt = base.clone().add(V(-3,1.2,-1.5)); }
  const dx=tgt.x-base.x, dz=tgt.z-base.z, dy=tgt.y-base.y;
  const worldYaw = Math.atan2(dx,dz);
  pump.turret.rotation.y = worldYaw - pump.g.rotation.y;
  const L1=BOOM,L2=BOOM; const h=Math.hypot(dx,dz);
  const d=Math.min(Math.hypot(h,dy), L1+L2-.05);
  const beta=Math.atan2(dy,h);
  const c=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1);
  const a1=beta+Math.acos(c);
  const ex=L1*Math.cos(a1), ey=L1*Math.sin(a1);
  const a2=Math.atan2(dy-ey, h-ex);
  pump.b1.rotation.x = -a1; pump.b2.rotation.x = -(a2-a1);
  if(target){
    const tip=new THREE.Vector3(); pump.tip.getWorldPosition(tip);
    hose.visible=true; hose.position.set(tip.x,tip.y-2.4,tip.z); hose.scale.set(1,2.4,1);
  }
}

const craneState={yaw:0.4,r:16,h:8};
function updateCrane(T,time){
  const on = inWin(T,3.0,7.2);
  crane.g.visible = on; crane.cable.visible=on; crane.hook.visible=on;
  if(!on) return;
  const rise = ease(seg(T,3.0,3.07)) * (1-ease(seg(T,7.0,7.18)));
  const mh = MAST_H*Math.max(rise,.02);
  crane.mast.scale.y = Math.max(rise,.02);
  crane.slew.position.y = .8+mh;
  crane.slew.visible = rise>.3;
  const jibY = .8+mh+1.2;
  const working = inWin(T,3.08,6.96);
  const yard = V(4,0,-9.6);
  let yaw, r, hy, loadOn=false;
  const top = topLevel(T)+ (T>=4?0:0);
  const cyc = Math.floor(time/14), p=(time/14)%1;
  const rx = Math.sin(cyc*12.9898)*4, rz = Math.cos(cyc*7.233)*4;
  const drop = V(rx, top, rz);
  const toPolar = v=>{ const dx=v.x-CRANE_POS.x, dz=v.z-CRANE_POS.z; return [Math.atan2(dx,dz), clamp(Math.hypot(dx,dz),4,27)]; };
  const [yY,rY]=toPolar(yard), [yD,rD]=toPolar(drop);
  const lerpAng=(a,b,t)=>{ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; };
  const hHigh = Math.max(top+7, 9);
  if(!working){ yaw=yY; r=10; hy=jibY-3; }
  else if(p<.14){ yaw=yY; r=rY; hy=lerp(hHigh,1.6,ease(p/.14)); }
  else if(p<.24){ yaw=yY; r=rY; hy=lerp(1.6,hHigh,ease((p-.14)/.1)); loadOn=true; }
  else if(p<.48){ const t=ease((p-.24)/.24); yaw=lerpAng(yY,yD,t); r=lerp(rY,rD,t); hy=hHigh; loadOn=true; }
  else if(p<.58){ yaw=yD; r=rD; hy=lerp(hHigh,top+1.8,ease((p-.48)/.1)); loadOn=true; }
  else if(p<.64){ yaw=yD; r=rD; hy=top+1.8; loadOn=p<.62; }
  else if(p<.72){ yaw=yD; r=rD; hy=lerp(top+1.8,hHigh,ease((p-.64)/.08)); }
  else { const t=ease((p-.72)/.28); yaw=lerpAng(yD,yY,t); r=lerp(rD,rY,t); hy=hHigh; }
  hy = Math.min(hy, jibY-2);
  crane.slew.rotation.y = yaw;
  crane.trolley.position.z = r;
  const tx = CRANE_POS.x + Math.sin(yaw)*r, tz = CRANE_POS.z + Math.cos(yaw)*r;
  crane.hook.position.set(tx,hy,tz);
  crane.cable.position.set(tx,hy+.35,tz); crane.cable.scale.set(1,Math.max(jibY-(hy+.35),.01),1);
  crane.cable.visible = rise>.3; crane.hook.visible = rise>.3;
  const li = T<4?0: T<5?1: T<6?2:3;
  crane.loads.forEach((l,i)=>l.visible = loadOn && i===li);
}

/* =========================================================
   소리 (Web Audio로 직접 합성 – 외부 파일 없음)
   ========================================================= */
const SND = { ctx:null, master:null, bgm:null, sfx:null, mode:2, noise:null, layers:{} };
// mode: 2 = 배경음+효과음, 1 = 효과음만, 0 = 끔
function initAudio(){
  if(SND.ctx){ if(SND.ctx.state==='suspended') SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  const ctx = SND.ctx = new AC();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(ctx.destination);
  SND.master = ctx.createGain(); SND.master.gain.value = .9; SND.master.connect(comp);
  // 배경음: 살짝 울림(딜레이)을 더해 부드럽게
  SND.bgm = ctx.createGain(); SND.bgm.gain.value = .13;
  const dl = ctx.createDelay(1); dl.delayTime.value = .32; const fb = ctx.createGain(); fb.gain.value=.22; const wet=ctx.createGain(); wet.gain.value=.25;
  SND.bgm.connect(SND.master); SND.bgm.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(SND.master);
  SND.sfx = ctx.createGain(); SND.sfx.gain.value = .55; SND.sfx.connect(SND.master);
  // 백색 소음 버퍼
  const buf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  SND.noise = buf;
  // 계속 이어지는 소리: 엔진 / 콘크리트 붓는 소리
  const mkLoop=(filterType,freq,q)=>{ const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; const f=ctx.createBiquadFilter(); f.type=filterType; f.frequency.value=freq; f.Q.value=q; const g=ctx.createGain(); g.gain.value=0; src.connect(f); f.connect(g); g.connect(SND.sfx); src.start(); return {g,f}; };
  SND.layers.engine = mkLoop('lowpass',160,.8);
  { const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=46; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=140; const g=ctx.createGain(); g.gain.value=0; o.connect(f); f.connect(g); g.connect(SND.sfx); o.start(); SND.layers.engineTone={g,o}; }
  SND.layers.pour = mkLoop('bandpass',650,.9);
  applySoundMode();
  startBgm();
  document.addEventListener('visibilitychange',()=>{ if(!SND.ctx) return; document.hidden? SND.ctx.suspend() : SND.ctx.resume(); });
}
function applySoundMode(){
  if(!SND.ctx) return; const t=SND.ctx.currentTime;
  SND.master.gain.setTargetAtTime(SND.mode===0?0:.9,t,.05);
  SND.bgm.gain.setTargetAtTime(SND.mode===2?.13:0,t,.15);
}
const mtof = m => 440*Math.pow(2,(m-69)/12);
function piano(midi,t,vel=.5,dest=SND.bgm,len=1.6){
  const ctx=SND.ctx, f=mtof(midi);
  const out=ctx.createGain(); out.gain.value=0;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(9000,f*6); lp.connect(dest);
  out.connect(lp);
  [[1,1],[2,.42],[3,.16],[4,.07]].forEach(([h,w])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*h*(1+(h-1)*.0008); const g=ctx.createGain(); g.gain.value=w; o.connect(g); g.connect(out); o.start(t); o.stop(t+len+.1); });
  out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(vel,t+.006);
  out.gain.exponentialRampToValueAtTime(vel*.35,t+.18); out.gain.exponentialRampToValueAtTime(.0001,t+len);
}
function tone(freq,t,dur,{type='sine',vol=.2,to=null,attack=.004}={}){
  const ctx=SND.ctx, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(SND.sfx); o.start(t); o.stop(t+dur+.05);
}
function noiseHit(t,dur,{type='bandpass',freq=1000,to=null,q=1,vol=.3,attack=.003}={}){
  const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.noise;
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); if(to) f.frequency.exponentialRampToValueAtTime(to,t+dur); f.Q.value=q;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(SND.sfx); s.start(t, Math.random()*1.5); s.stop(t+dur+.05);
}
const SFX = {
  click:  t=>{ tone(1046,t,.07,{vol:.12}); tone(1568,t+.03,.06,{vol:.08}); },
  chime:  t=>{ [72,76,79,84].forEach((m,i)=>piano(m,t+i*.07,.32,SND.sfx,1.2)); },
  knock:  t=>{ noiseHit(t,.07,{freq:850,q:4,vol:.5}); tone(190,t,.06,{type:'triangle',vol:.15,to:120}); },
  thud:   t=>{ tone(110,t,.32,{vol:.55,to:42}); noiseHit(t,.18,{type:'lowpass',freq:380,vol:.35}); },
  clang:  t=>{ [1180,1873,2655,3310].forEach((f,i)=>tone(f*(.97+Math.random()*.06),t,.45-i*.06,{vol:.07})); noiseHit(t,.03,{type:'highpass',freq:3000,vol:.15}); },
  tick:   t=>{ tone(1900,t,.04,{type:'square',vol:.05}); noiseHit(t,.03,{freq:2500,q:3,vol:.2}); },
  zip:    t=>{ noiseHit(t,.28,{freq:1500,to:6500,q:6,vol:.22,attack:.02}); },
  spray:  t=>{ noiseHit(t,.5,{type:'highpass',freq:3500,vol:.14,attack:.05}); },
  scoop:  t=>{ noiseHit(t,.55,{type:'lowpass',freq:700,to:250,vol:.35,attack:.05}); },
  dump:   t=>{ noiseHit(t,1.0,{type:'lowpass',freq:500,to:180,vol:.45,attack:.08}); for(let i=0;i<6;i++) noiseHit(t+.1+i*.11,.08,{freq:400+Math.random()*500,q:3,vol:.18}); },
  beep:   t=>{ tone(1050,t,.18,{type:'square',vol:.05}); tone(1050,t+.45,.18,{type:'square',vol:.05}); },
  hammer: t=>{ tone(85,t,.28,{vol:.6,to:40}); noiseHit(t,.06,{freq:1400,q:2,vol:.35}); tone(620,t,.15,{type:'triangle',vol:.06}); },
  clink:  t=>{ tone(2400+Math.random()*300,t,.16,{vol:.06}); tone(3150,t+.01,.12,{vol:.04}); },
  ding:   t=>{ piano(84,t,.35,SND.sfx,1.4); piano(91,t+.12,.3,SND.sfx,1.6); },
  tap:    t=>{ noiseHit(t,.045,{freq:2300+Math.random()*600,q:7,vol:.22}); tone(520,t,.035,{type:'triangle',vol:.06}); },
  ting:   t=>{ tone(2637,t,.6,{vol:.06}); tone(3951,t+.005,.45,{vol:.04}); },
  bloop:  t=>{ tone(260,t,.16,{vol:.22,to:620}); tone(420,t+.09,.12,{vol:.12,to:820}); },
  zap:    t=>{ tone(110,t,.14,{type:'square',vol:.06}); noiseHit(t,.14,{type:'highpass',freq:2600,vol:.16}); tone(1760,t,.08,{type:'sawtooth',vol:.03,to:880}); },
  whoosh: t=>{ noiseHit(t,.55,{freq:350,to:1600,q:1.2,vol:.22,attack:.12}); },
  elev:   t=>{ piano(88,t,.35,SND.sfx,1.5); piano(84,t+.35,.33,SND.sfx,1.8); },
  switch: t=>{ noiseHit(t,.02,{type:'highpass',freq:4000,vol:.35}); tone(1500,t,.02,{type:'square',vol:.05}); },
  pop:    t=>{ tone(520,t,.09,{vol:.16,to:950}); },
  popHi:  t=>{ tone(780,t,.09,{vol:.14,to:1400}); },
  stamp:  t=>{ SFX.thud(t); [72,76,79,84,88].forEach((m,i)=>piano(m,t+.25+i*.09,.34,SND.sfx,1.6)); [72,76,79,84].forEach(m=>piano(m,t+.8,.22,SND.sfx,2.6)); },
  night:  t=>{ [79,76,72].forEach((m,i)=>piano(m,t+i*.12,.25,SND.sfx,1.6)); },
  day:    t=>{ [72,76,79].forEach((m,i)=>piano(m,t+i*.1,.25,SND.sfx,1.4)); },
};
function sfx(name,delay=0){ if(!SND.ctx||SND.mode===0||SND.ctx.state!=='running') return; SFX[name](SND.ctx.currentTime+.01+delay); }

/* ---- 배경음: 밝고 가벼운 피아노 (직접 작곡한 8마디 반복) ---- */
const BGM = (()=>{
  const _=null;
  const mel = [
    [76,_,79,_,84,_,79,76],[74,_,79,_,83,_,81,79],[72,_,76,_,81,_,79,76],[77,_,81,_,84,_,81,_],
    [79,76,79,84,_,83,84,_],[83,_,86,_,83,81,79,_],[81,_,84,_,83,_,86,_],[84,_,_,_,79,_,76,_],
    [76,77,79,_,79,_,76,_],[74,76,77,_,77,_,74,_],[72,74,76,_,81,_,79,_],[77,_,76,_,74,_,72,_],
    [76,_,79,_,84,_,86,_],[83,_,81,_,79,_,77,_],[76,_,77,_,79,_,74,_],[72,_,_,_,_,_,_,_],
  ];
  const roots = [48,43,45,41,48,43,[41,43],48, 48,43,45,41,48,43,[41,43],48];
  return {mel,roots};
})();
let bgmNext=0, bgmStep=0, bgmTimer=null;
function startBgm(){
  if(bgmTimer) return;
  bgmNext = SND.ctx.currentTime + .3;
  const eighth = 60/100/2;
  bgmTimer = setInterval(()=>{
    if(!SND.ctx || SND.ctx.state!=='running') return;
    while(bgmNext < SND.ctx.currentTime + .25){
      const bar = Math.floor(bgmStep/8)%16, e = bgmStep%8;
      const m = BGM.mel[bar][e];
      if(m) piano(m, bgmNext, e%2===0?.42:.32, SND.bgm, 1.5);
      let r = BGM.roots[bar]; if(Array.isArray(r)) r = r[e<4?0:1];
      const arp = [0,7,12,16,12,7,12,7][e];
      piano(r+arp - (e===0?0:0), bgmNext, e===0?.38:.2, SND.bgm, e===0?2.2:1.0);
      if(e===0) piano(r-12, bgmNext, .22, SND.bgm, 2.4);
      bgmNext += eighth; bgmStep++;
    }
  }, 40);
}

/* ---- 진행도(T)에 맞춰 울리는 효과음 목록 ---- */
const EVENTS = (()=>{
  const ev=[]; const add=(t,n)=>ev.push([t,n]);
  const nF=fencePanels.length; for(let i=0;i<nF;i+=3) add(.02+.28*i/nF+.03,'knock');
  add(.43,'thud'); add(.46,'knock');
  [.5,.53,.56,.59].forEach(t=>add(t,'tick'));
  [.63,.69,.75,.81].forEach(t=>add(t,'zip'));
  add(.76,'spray');
  for(let i=0;i<36;i+=3) add(1.0+i*.0038+.03,'clang');
  for(let t=2.385;t<2.5;t+=.014) add(t,'clink');
  [2.8,2.84,2.88,2.92,2.96].forEach(t=>add(t,'spray')); add(2.985,'ding');
  for(let f=0;f<4;f++){ const a=3+f*.25, L=.25;
    [.01,.05,.09,.13].forEach(u=>add(a+u*L,'clink'));
    [.17,.2,.23,.26,.28,.31].forEach(u=>add(a+u*L,'knock'));
    [.32,.34].forEach(u=>add(a+u*L,'clink'));
    [.7,.76,.82,.88].forEach(u=>add(a+u*L,'spray'));
    [.92,.935,.95].forEach(u=>add(a+u*L,'knock'));
    add(a+.97*L,'ding'); }
  for(let t=4.01;t<4.18;t+=.02) add(t,'clang');
  for(let t=4.16;t<4.55;t+=.011) add(t,'tap');
  for(let t=4.585;t<4.8;t+=.018) add(t,'ting');
  add(4.71,'whoosh'); add(4.81,'thud'); add(4.85,'whoosh');
  for(let t=4.89;t<4.98;t+=.025) add(t,'clang');
  [5.02,5.09,5.13,5.17,5.21].forEach(t=>add(t,'bloop'));
  [5.27,5.34,5.39,5.44].forEach(t=>add(t,'zap'));
  [5.51,5.57,5.63].forEach(t=>add(t,'whoosh'));
  [5.63,5.67].forEach(t=>add(t,'thud'));
  add(5.77,'elev');
  for(let t=6.03;t<6.2;t+=.03) add(t,'thud');
  for(let t=6.23;t<6.37;t+=.035) add(t,'whoosh');
  [6.54,6.56,6.58,6.6].forEach(t=>add(t,'switch'));
  for(let t=6.65;t<6.92;t+=.02) add(t,'pop');
  add(7.01,'whoosh'); add(7.12,'thud');
  for(let t=7.19;t<7.31;t+=.02) add(t,'knock');
  add(7.2,'whoosh'); add(7.31,'spray');
  for(let t=7.37;t<7.53;t+=.03) add(t,'popHi');
  add(7.45,'switch'); add(7.49,'switch');
  add(7.8,'stamp');
  return ev.sort((a,b)=>a[0]-b[0]);
})();
let prevT=0;
const loopState={dig:-1,truck:-1,hammer:-1,crane:-1};
function updateSound(T,time,dt){
  if(!SND.ctx || SND.ctx.state!=='running'){ prevT=T; return; }
  // 1) T가 지나간 순간의 효과음 (재생 중일 때만, 한 프레임에 너무 많이 울리지 않게)
  if(playing && T>prevT && T-prevT<.05){
    let n=0; for(const [t,name] of EVENTS){ if(t>prevT && t<=T && n<4){ sfx(name); n++; } }
  }
  prevT=T;
  // 2) 기계가 반복하는 소리 (시간 기반)
  const live = playing;
  if(live && inWin(T,DIG.start,DIG.end)){
    const dg=Math.floor(digInfo.digs+.5), dp=digInfo.dumps, pk=digInfo.parked?1:0;
    if(loopState.dig!==null && typeof loopState.dig==='object'){
      if(dg>loopState.dig.dg) sfx('scoop');
      if(dp>loopState.dig.dp) sfx('dump');
      if(pk && !loopState.dig.pk) sfx('beep');
    }
    loopState.dig={dg,dp,pk};
  } else loopState.dig=null;
  if(live && inWin(T,2.02,2.4)){
    const i=Math.floor((T-2.02)/.0225), u=((T-2.02)/.0225)%1;
    const k=Math.floor(time*9/Math.PI);
    if(u>.4 && k!==loopState.hammer){ sfx('hammer'); }
    loopState.hammer=k;
  }
  if(live && inWin(T,3.08,6.96)){
    const p=(time/14)%1, ck=Math.floor(time/14)*10+(p>.62?1:0);
    if(ck!==loopState.crane){ if(loopState.crane>=0 && p>.62) sfx('knock'); loopState.crane=ck; }
  }
  // 3) 이어지는 소리 크기
  let eng=0;
  if(inWin(T,1.1,2.0)) eng=.5; if(inWin(T,2.0,2.42)) eng=.45; if(inWin(T,2.5,3.98)) eng=Math.max(eng,.32);
  if(inWin(T,3.0,7.2)) eng=Math.max(eng,.16);
  let pour=0;
  if(pourTarget) pour=.45;
  if(!live){ eng*=0; pour=0; }
  const t=SND.ctx.currentTime;
  SND.layers.engine.g.gain.setTargetAtTime(eng*.9,t,.2);
  SND.layers.engineTone.g.gain.setTargetAtTime(eng*.35,t,.2);
  SND.layers.engineTone.o.frequency.setTargetAtTime(44+Math.sin(time*3)*3,t,.1);
  SND.layers.pour.g.gain.setTargetAtTime(pour*(.8+.2*Math.sin(time*5)),t,.15);
}

const stepper=$('stepper');
// Drag the stage strip without triggering a stage button on release.
let stepperDrag=null, suppressStepperClick=false;
stepper.addEventListener('pointerdown',event=>{
  suppressStepperClick=false;
  if(event.pointerType!=='mouse' || event.button!==0) return;
  if(stepper.scrollWidth<=stepper.clientWidth) return;
  const scrollLeft=stepper.scrollLeft;
  stepper.scrollTo({left:scrollLeft,behavior:'instant'});
  stepperDrag={id:event.pointerId,x:event.clientX,left:scrollLeft,moved:false};
});
stepper.addEventListener('pointermove',event=>{
  if(!stepperDrag || event.pointerId!==stepperDrag.id) return;
  const delta=event.clientX-stepperDrag.x;
  if(!stepperDrag.moved && Math.abs(delta)<6) return;
  if(!stepperDrag.moved){
    stepperDrag.moved=true;
    suppressStepperClick=true;
    stepper.classList.add('dragging');
    stepper.setPointerCapture(event.pointerId);
  }
  event.preventDefault();
  stepper.scrollLeft=stepperDrag.left-delta;
});
function finishStepperDrag(event){
  if(!stepperDrag || event.pointerId!==stepperDrag.id) return;
  stepperDrag=null;
  stepper.classList.remove('dragging');
  if(stepper.hasPointerCapture(event.pointerId)) stepper.releasePointerCapture(event.pointerId);
}
window.addEventListener('pointerup',finishStepperDrag);
window.addEventListener('pointercancel',finishStepperDrag);
stepper.addEventListener('lostpointercapture',finishStepperDrag);
stepper.addEventListener('click',event=>{
  if(!suppressStepperClick || event.detail===0) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  suppressStepperClick=false;
},true);
STAGES.forEach((s,i)=>{
  const b=document.createElement('button'); b.className='st'; b.innerHTML=`<b>${i+1}</b><span>${s.short}</span>`;
  b.addEventListener('click',()=>{ if(!started) begin(); initAudio(); goStage(i); });
  stepper.appendChild(b);
});
const subsEl=$('subs');
function renderStageUI(){
  const s=STAGES[stageIdx];
  $('badge').textContent=t('badge',{step:stageIdx+1});
  $('term').textContent=s.term;
  $('title').textContent=s.title;
  $('lead').textContent=s.lead;
  $('desc').textContent=s.desc;
  $('tip').textContent=s.tip;
  subsEl.innerHTML='';
  s.subs.forEach(([name,a],k)=>{
    const b=document.createElement('button'); b.className='sub'; b.innerHTML=`<i></i><span>${name}</span>`;
    b.addEventListener('click',()=>{
      if(s.cycle){ const f=clamp(Math.floor((curT-3)/.25),0,3); curT=3+f*.25+a*.25+.0001; }
      else curT=stageIdx+a+.0001;
      playing=true; syncPlay(); prevT=curT; sfx('click');
    });
    subsEl.appendChild(b);
  });
  $('floorinfo').style.display = s.cycle?'block':'none';
  $('legend').style.display = s.toggle==='xray'?'flex':'none';
  [...stepper.children].forEach((b,i)=>{ b.classList.toggle('cur',i===stageIdx); b.classList.toggle('done',i<stageIdx); });
  stepper.children[stageIdx].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('prev').disabled = stageIdx===0;
  $('next').textContent = t(stageIdx===7?'restart':'next');
  syncToggle();
  $('panel').querySelector('.pbody').scrollTop=0;
}
function syncToggle(){
  const s=STAGES[stageIdx], toggleButton=$('toggle');
  if(!s.toggle){ toggleButton.style.display='none'; return; }
  toggleButton.style.display='block';
  if(s.toggle==='xray'){ toggleButton.textContent = t(xray?'xrayOn':'xrayOff'); toggleButton.classList.toggle('on',xray); }
  if(s.toggle==='cut'){ toggleButton.textContent = t(cutaway?'cutOn':'cutOff'); toggleButton.classList.toggle('on',cutaway); }
  if(s.toggle==='night'){ toggleButton.textContent = t(night?'nightOn':'nightOff'); toggleButton.classList.toggle('on',night); }
}
$('toggle').addEventListener('click',()=>{
  const s=STAGES[stageIdx];
  if(s.toggle==='xray') xray=!xray;
  if(s.toggle==='cut') cutaway=!cutaway;
  if(s.toggle==='night'){ night=!night; sfx(night?'night':'day'); } else sfx('click');
  syncToggle();
});
function syncPlay(){
  const button=$('play'); button.textContent=playing?'⏸':'▶';
  button.title=t(playing?'pause':'resume'); button.setAttribute('aria-label',button.title);
  button.setAttribute('aria-pressed',String(playing));
}
function goStage(i){
  stageIdx=clamp(i,0,7); curT=stageIdx; playing=true;
  xray=true; cutaway=true; night=false;
  document.querySelectorAll('.lbl.open').forEach(x=>x.classList.remove('open'));
  camFollow = stageIdx===3;
  prevT=curT; renderStageUI(); syncPlay(); layout(); flyTo(STAGES[stageIdx].cam);
  sfx('chime');
}
$('prev').addEventListener('click',()=>goStage(stageIdx-1));
$('next').addEventListener('click',()=>goStage(stageIdx===7?0:stageIdx+1));
$('replay').addEventListener('click',()=>goStage(stageIdx));
$('play').addEventListener('click',()=>{ if(!playing && curT>=stageIdx+1-1e-4){ curT=stageIdx; prevT=curT; } playing=!playing; syncPlay(); sfx('click'); });
$('btnCam').addEventListener('click',()=>{ flyTo(started?STAGES[stageIdx].cam:INTRO_CAM,1.2); sfx('whoosh'); });
$('btnLabels').addEventListener('click',e=>{ document.body.classList.toggle('nolabels'); e.currentTarget.classList.toggle('on'); sfx('click'); });
document.addEventListener('keydown',e=>{ if(!started || e.target.closest('select,input,textarea,[contenteditable="true"]')) return; if(e.key==='ArrowRight') goStage(Math.min(7,stageIdx+1)); if(e.key==='ArrowLeft') goStage(stageIdx-1); if(e.key===' '){ e.preventDefault(); $('play').click(); } });

function begin(){
  if(started) return;
  started=true; controls.autoRotate=false;
  $('intro').classList.add('gone'); $('panel').classList.remove('hidden');
}
$('start').addEventListener('click',()=>{ initAudio(); begin(); goStage(0); });

function updateSubUI(){
  const s=STAGES[stageIdx];
  const local = clamp(curT-stageIdx);
  let u = local;
  if(s.cycle){
    const f=clamp(Math.floor(local*4),0,3); u = local>=1?1:(local*4-f);
    $('floorinfo').innerHTML = local>=1 ? t('floorComplete') : t('floorProgress',{floor:f+1});
  }
  [...subsEl.children].forEach((b,k)=>{
    const [,a,e]=s.subs[k]; const p=clamp((u-a)/(e-a));
    b.style.setProperty('--p',p.toFixed(3));
    b.classList.toggle('now', p>0&&p<1); b.classList.toggle('fin', p>=1 && !(s.cycle&&local<1&&false));
  });
  $('approved').classList.toggle('show', stageIdx===7 && curT>=7.8);
}

/* =========================================================
   라벨 위치
   ========================================================= */
const vproj=new THREE.Vector3();
const gEl=$('gauge');
let gLast='';
function updateGauge(){
  if(!started || !gauge.show){ gEl.style.display='none'; return; }
  vproj.copy(gauge.pos).project(camera);
  if(vproj.z>1){ gEl.style.display='none'; return; }
  const w=innerWidth,h=innerHeight;
  const x=clamp((vproj.x+1)/2*w,140,w-140), y=clamp((1-vproj.y)/2*h,150,h-20);
  gEl.style.display='flex';
  gEl.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;
  const key=gauge.mode+gauge.title+gauge.sub;
  if(key!==gLast){ gEl.className='gauge '+gauge.mode; $('gT').textContent=gauge.title; $('gS').textContent=gauge.sub; gLast=key; }
  $('gB').style.width=(gauge.p*100).toFixed(1)+'%';
}
function updateLabels(){
  updateGauge();
  const w=innerWidth,h=innerHeight;
  LABELS.forEach((L,i)=>{
    const el=labelEls[i];
    const on = started && L.on(curT);
    if(!on){ el.style.display='none'; el.classList.remove('open'); return; }
    vproj.copy(L.pos()).project(camera);
    if(vproj.z>1||vproj.x<-1.1||vproj.x>1.1||vproj.y<-1.1||vproj.y>1.1){ el.style.display='none'; return; }
    el.style.display='flex';
    el.style.transform=`translate(${(vproj.x+1)/2*w}px,${(1-vproj.y)/2*h}px) translate(-50%,-100%)`;
  });
}

/* =========================================================
   루프
   ========================================================= */
const clock=new THREE.Clock();
let elapsed=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05); elapsed+=dt;
  if(started && playing){
    curT += dt/STAGES[stageIdx].dur;
    if(curT>=stageIdx+1){ curT=stageIdx+1; playing=false; syncPlay(); }
  }
  if(fly){
    fly.t+=dt/fly.dur; const k=ease(clamp(fly.t));
    camera.position.lerpVectors(fly.fromP,fly.toP,k);
    controls.target.lerpVectors(fly.fromT,fly.toT,k);
    if(fly.t>=1) fly=null;
  }
  if(camFollow && !fly && stageIdx===3){
    const want=clamp(topLevel(curT)-.5,3,13), dy=(want-controls.target.y)*Math.min(1,dt*1.2);
    controls.target.y+=dy; camera.position.y+=dy;
  }
  update(curT,elapsed,dt);
  updateSound(curT,elapsed,dt);
  controls.update();
  renderer.render(scene,camera);
  updateLabels();
  if(started) updateSubUI();
  requestAnimationFrame(frame);
}

const allMats=new Set();
scene.traverse(o=>{ if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.envMapIntensity!==undefined){ m.userData.env=m.envMapIntensity; allMats.add(m);} }); } });
// 시작: 완성된 건물을 천천히 돌려 보여주기
layout();
{ const c=camPreset(INTRO_CAM); camera.position.copy(c.p); controls.target.copy(c.t); }
controls.autoRotate=true; controls.autoRotateSpeed=.5;
function refreshLanguage(){
  const panelBody=$('panel').querySelector('.pbody');
  const scrollTop=panelBody.scrollTop;
  translateStages(); translateLabels(); translateTextures();
  [...stepper.children].forEach((button,index)=>{
    button.querySelector('span').textContent=STAGES[index].short;
    button.title=STAGES[index].term;
    button.setAttribute('aria-label',t('badge',{step:index+1})+' · '+STAGES[index].term);
  });
  renderStageUI(); updateSubUI(); syncPlay(); syncSoundBtn();
  panelBody.scrollTop=scrollTop;
  $('toast').classList.remove('show');
  gLast=''; update(curT,elapsed,0); updateLabels();
  layout();
}
window.addEventListener('constructionlanguagechange',refreshLanguage);
refreshLanguage();

requestAnimationFrame(()=>{ $('loading').classList.add('gone'); });
frame();
